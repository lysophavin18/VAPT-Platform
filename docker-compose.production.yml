# VAPT Platform - Production Docker Compose
# Designed by VINNZz
# Version: 2.0

version: '3.9'

networks:
  vapt-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  tools-network:
    driver: bridge
    internal: true  # No external access
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  postgres_data:
  redis_data:
  reports_data:
  uploads_data:
  nuclei_templates:
  zap_data:
  metasploit_data:

services:
  # ============================================
  # DATABASE SERVICES
  # ============================================
  
  postgres:
    image: postgres:15-alpine
    container_name: vapt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vapt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-VAPTSecure2024!}
      POSTGRES_DB: ${POSTGRES_DB:-vapt_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - vapt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vapt_user} -d ${POSTGRES_DB:-vapt_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: vapt-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - vapt-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================
  # APPLICATION SERVICES
  # ============================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vapt-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vapt_user}:${POSTGRES_PASSWORD:-VAPTSecure2024!}@postgres:5432/${POSTGRES_DB:-vapt_platform}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production-use-openssl-rand-hex-32}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - MAX_CONCURRENT_SCANS=${MAX_CONCURRENT_SCANS:-5}
      - SCAN_TIMEOUT_SECONDS=${SCAN_TIMEOUT_SECONDS:-3600}
    volumes:
      - reports_data:/app/reports
      - uploads_data:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - vapt-network
      - tools-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: vapt-celery-worker
    restart: unless-stopped
    command: celery -A orchestrator.celery_app worker -l info -c ${CELERY_WORKERS:-4} -Q default,scans,reports
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vapt_user}:${POSTGRES_PASSWORD:-VAPTSecure2024!}@postgres:5432/${POSTGRES_DB:-vapt_platform}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - MAX_CONCURRENT_SCANS=${MAX_CONCURRENT_SCANS:-5}
    volumes:
      - reports_data:/app/reports
      - uploads_data:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - vapt-network
      - tools-network
    depends_on:
      - backend
      - redis
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: vapt-celery-beat
    restart: unless-stopped
    command: celery -A orchestrator.celery_app beat -l info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vapt_user}:${POSTGRES_PASSWORD:-VAPTSecure2024!}@postgres:5432/${POSTGRES_DB:-vapt_platform}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - vapt-network
    depends_on:
      - celery-worker
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  flower:
    image: mher/flower:2.0
    container_name: vapt-flower
    restart: unless-stopped
    command: celery --broker=redis://redis:6379/0 flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-FlowerAdmin2024!}
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    networks:
      - vapt-network
    depends_on:
      - redis
      - celery-worker
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vapt-frontend
    restart: unless-stopped
    networks:
      - vapt-network
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  nginx:
    image: nginx:alpine
    container_name: vapt-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - reports_data:/app/reports:ro
    networks:
      - vapt-network
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  # ============================================
  # WEB PENTESTING TOOLS
  # ============================================

  nmap:
    image: instrumentisto/nmap:latest
    container_name: vapt-nmap
    networks:
      - tools-network
    volumes:
      - uploads_data:/output
    entrypoint: ["tail", "-f", "/dev/null"]
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  nikto:
    build:
      context: ./tools/nikto
      dockerfile: Dockerfile
    container_name: vapt-nikto
    networks:
      - tools-network
    volumes:
      - uploads_data:/output
    entrypoint: ["tail", "-f", "/dev/null"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  gobuster:
    build:
      context: ./tools/gobuster
      dockerfile: Dockerfile
    container_name: vapt-gobuster
    networks:
      - tools-network
    volumes:
      - uploads_data:/output
      - ./wordlists:/wordlists:ro
    entrypoint: ["tail", "-f", "/dev/null"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  dirb:
    build:
      context: ./tools/dirb
      dockerfile: Dockerfile
    container_name: vapt-dirb
    networks:
      - tools-network
    volumes:
      - uploads_data:/output
      - ./wordlists:/wordlists:ro
    entrypoint: ["tail", "-f", "/dev/null"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  nuclei:
    image: projectdiscovery/nuclei:latest
    container_name: vapt-nuclei
    networks:
      - tools-network
    volumes:
      - uploads_data:/output
      - nuclei_templates:/root/nuclei-templates
    entrypoint: ["tail", "-f", "/dev/null"]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M

  katana:
    image: projectdiscovery/katana:latest
    container_name: vapt-katana
    networks:
      - tools-network
    volumes:
      - uploads_data:/output
    entrypoint: ["tail", "-f", "/dev/null"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  wpscan:
    image: wpscanteam/wpscan:latest
    container_name: vapt-wpscan
    networks:
      - tools-network
    volumes:
      - uploads_data:/output
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      - WPSCAN_API_TOKEN=${WPSCAN_API_TOKEN:-}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  sqlmap:
    build:
      context: ./tools/sqlmap
      dockerfile: Dockerfile
    container_name: vapt-sqlmap
    networks:
      - tools-network
    volumes:
      - uploads_data:/output
    entrypoint: ["tail", "-f", "/dev/null"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  hydra:
    build:
      context: ./tools/hydra
      dockerfile: Dockerfile
    container_name: vapt-hydra
    networks:
      - tools-network
    volumes:
      - uploads_data:/output
      - ./wordlists:/wordlists:ro
    entrypoint: ["tail", "-f", "/dev/null"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # ============================================
  # DAST / ADVANCED TOOLS
  # ============================================

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: vapt-zap
    networks:
      - tools-network
    volumes:
      - zap_data:/zap/wrk
      - uploads_data:/output
    command: zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.disablekey=true -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================
  # API PENTESTING TOOLS
  # ============================================

  newman:
    build:
      context: ./tools/newman
      dockerfile: Dockerfile
    container_name: vapt-newman
    networks:
      - tools-network
    volumes:
      - uploads_data:/output
      - ./collections:/collections:ro
    entrypoint: ["tail", "-f", "/dev/null"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ============================================
  # EXPLOITATION TOOLS (Isolated, Simulation Only)
  # ============================================

  metasploit:
    image: metasploitframework/metasploit-framework:latest
    container_name: vapt-metasploit
    networks:
      - tools-network
    volumes:
      - metasploit_data:/root/.msf4
      - uploads_data:/output
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      - MSF_DATABASE_CONFIG=/opt/metasploit-framework/config/database.yml
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    # IMPORTANT: This container is for CVE matching and simulation ONLY
    # Destructive actions are blocked by orchestrator

