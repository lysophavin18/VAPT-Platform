version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: vapt-postgres
    environment:
      POSTGRES_DB: vapt_db
      POSTGRES_USER: vapt_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-VaptSecure2024!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - vapt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vapt_admin -d vapt_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for Task Queue
  redis:
    image: redis:7-alpine
    container_name: vapt-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-VaptRedis2024!}
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - vapt-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-VaptRedis2024!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vapt-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://vapt_admin:${DB_PASSWORD:-VaptSecure2024!}@postgres:5432/vapt_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-VaptRedis2024!}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION=3600
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-VaptRedis2024!}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-VaptRedis2024!}@redis:6379/2
    volumes:
      - ./backend:/app
      - scan_results:/app/results
      - ./tools:/tools
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vapt-network
    restart: unless-stopped

  # Celery Worker - Scan Orchestrator
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: vapt-celery-worker
    command: celery -A orchestrator.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql+asyncpg://vapt_admin:${DB_PASSWORD:-VaptSecure2024!}@postgres:5432/vapt_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-VaptRedis2024!}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-VaptRedis2024!}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-VaptRedis2024!}@redis:6379/2
    volumes:
      - ./backend:/app
      - scan_results:/app/results
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      - postgres
      - backend
    networks:
      - vapt-network
    restart: unless-stopped

  # Celery Beat - Scheduled Tasks
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: vapt-celery-beat
    command: celery -A orchestrator.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://vapt_admin:${DB_PASSWORD:-VaptSecure2024!}@postgres:5432/vapt_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-VaptRedis2024!}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-VaptRedis2024!}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-VaptRedis2024!}@redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - celery-worker
    networks:
      - vapt-network
    restart: unless-stopped

  # Flower - Celery Monitoring
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: vapt-flower
    command: celery -A orchestrator.celery_app flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin123}
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-VaptRedis2024!}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-VaptRedis2024!}@redis:6379/2
    ports:
      - "5555:5555"
    depends_on:
      - celery-worker
    networks:
      - vapt-network
    restart: unless-stopped

  # Frontend Web Interface
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vapt-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - vapt-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: vapt-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - vapt-network
    restart: unless-stopped

  # ============ SECURITY TOOLS ============

  # Nmap Scanner
  nmap:
    image: instrumentisto/nmap:latest
    container_name: vapt-nmap
    volumes:
      - scan_results:/results
    networks:
      - vapt-network
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

  # OWASP ZAP
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: vapt-zap
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true -config api.key=${ZAP_API_KEY:-zap-api-key-2024}
    volumes:
      - zap_data:/zap/wrk
      - scan_results:/results
    ports:
      - "8081:8080"
    networks:
      - vapt-network
    restart: unless-stopped

  # Nuclei Scanner
  nuclei:
    image: projectdiscovery/nuclei:latest
    container_name: vapt-nuclei
    volumes:
      - nuclei_templates:/root/nuclei-templates
      - scan_results:/results
    networks:
      - vapt-network
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

  # SQLMap
  sqlmap:
    build:
      context: ./tools/sqlmap
      dockerfile: Dockerfile
    container_name: vapt-sqlmap
    volumes:
      - scan_results:/results
    networks:
      - vapt-network
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

  # Nikto Scanner
  nikto:
    build:
      context: ./tools/nikto
      dockerfile: Dockerfile
    container_name: vapt-nikto
    volumes:
      - scan_results:/results
    networks:
      - vapt-network
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

  # Gobuster
  gobuster:
    build:
      context: ./tools/gobuster
      dockerfile: Dockerfile
    container_name: vapt-gobuster
    volumes:
      - scan_results:/results
      - ./wordlists:/wordlists
    networks:
      - vapt-network
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

  # Katana Web Crawler
  katana:
    image: projectdiscovery/katana:latest
    container_name: vapt-katana
    volumes:
      - scan_results:/results
    networks:
      - vapt-network
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

  # WPScan
  wpscan:
    image: wpscanteam/wpscan:latest
    container_name: vapt-wpscan
    volumes:
      - scan_results:/results
    networks:
      - vapt-network
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

  # Hydra
  hydra:
    build:
      context: ./tools/hydra
      dockerfile: Dockerfile
    container_name: vapt-hydra
    volumes:
      - scan_results:/results
      - ./wordlists:/wordlists
    networks:
      - vapt-network
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

  # Metasploit Framework
  metasploit:
    image: metasploitframework/metasploit-framework:latest
    container_name: vapt-metasploit
    volumes:
      - msf_data:/root/.msf4
      - scan_results:/results
    ports:
      - "4444:4444"
    networks:
      - vapt-network
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  scan_results:
  zap_data:
  nuclei_templates:
  msf_data:

networks:
  vapt-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
