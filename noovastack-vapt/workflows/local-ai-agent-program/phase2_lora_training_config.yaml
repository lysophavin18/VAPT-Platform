model:
  name_or_path: /models/qwen3-coder-30b-base
  trust_remote_code: true
  torch_dtype: bfloat16
  must_match_inference_base: qwen3-coder:30b-64k

dataset:
  train_file: data/noovastack_train.jsonl
  validation_file: data/noovastack_validation.jsonl
  max_sequence_length: 8192
  train_only_quality_labels: [gold, approved]
  never_train_on_quality_labels: [needs_revision, rejected]

training:
  method: sft
  epochs: 2
  learning_rate: 0.0001
  warmup_ratio: 0.05
  gradient_accumulation_steps: 16
  per_device_train_batch_size: 1
  gradient_checkpointing: true
  bf16: true
  evaluation_strategy: steps
  eval_steps: 100
  save_steps: 100
  logging_steps: 10

lora:
  rank: 32
  alpha: 64
  dropout: 0.05
  target_modules_require_architecture_inspection: true
  candidate_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

safety_notes:
  - Do not begin with 64K-token examples.
  - Start with 4K-8K examples for normal agent tasks.
  - Use 8K-16K only for complex report/evidence tasks.
  - Keep customer data encrypted and sanitized before training transfer.
