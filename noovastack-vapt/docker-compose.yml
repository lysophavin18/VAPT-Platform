services:
  postgres:
    image: postgres:16-alpine
    container_name: noovastack-postgres
    environment:
      POSTGRES_DB: noovastack_vapt
      POSTGRES_USER: noovastack
      POSTGRES_PASSWORD: noovastack_secure_2024!
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"
    networks:
      - noovastack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noovastack -d noovastack_vapt"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: noovastack-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@noovastack.com}
      PGADMIN_DEFAULT_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_LOGIN_BANNER: "'Authorized NoovaStack administrators only'"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./configs/pgadmin-servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - noovastack-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: noovastack-redis
    command: redis-server --appendonly yes --requirepass noovastack_redis_2024!
    volumes:
      - redis_data:/data
    ports:
      - "6381:6379"
    networks:
      - noovastack-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "noovastack_redis_2024!", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noovastack-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://noovastack:noovastack_secure_2024!@postgres:5432/noovastack_vapt
      - REDIS_URL=redis://:noovastack_redis_2024!@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY to a secure random value of at least 32 characters}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION=3600
      - CELERY_BROKER_URL=redis://:noovastack_redis_2024!@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:noovastack_redis_2024!@redis:6379/2
      - NVD_API_KEY=${NVD_API_KEY:-}
      - CVE_HTTP_TIMEOUT_SECONDS=${CVE_HTTP_TIMEOUT_SECONDS:-45}
      - CVE_STALE_AFTER_HOURS=${CVE_STALE_AFTER_HOURS:-4}
      - NVD_REQUEST_DELAY_SECONDS=${NVD_REQUEST_DELAY_SECONDS:-6}
      - AI_PROVIDER=${AI_PROVIDER:-noovastack-local}
      - AI_BASE_URL=${AI_BASE_URL:-https://chat.noovastack.com/api}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-qwen3.6-coder:35b-32k}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-240}
      - AI_MAX_OUTPUT_TOKENS=${AI_MAX_OUTPUT_TOKENS:-4096}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.2}
      - AI_ENV_FILE=/app-config/.env
    volumes:
      - ./backend:/app
      - ./.env:/app-config/.env
      - scan_results:/app/results
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - noovastack-network
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noovastack-celery-worker
    command: celery -A workers.celery_app worker --loglevel=info --pool=solo --concurrency=1 -Q asset_discovery,scan,reporting,scheduling,ai,monitoring
    environment:
      - DATABASE_URL=postgresql+asyncpg://noovastack:noovastack_secure_2024!@127.0.0.1:5434/noovastack_vapt
      - REDIS_URL=redis://:noovastack_redis_2024!@127.0.0.1:6381/0
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://:noovastack_redis_2024!@127.0.0.1:6381/1
      - CELERY_RESULT_BACKEND=redis://:noovastack_redis_2024!@127.0.0.1:6381/2
      - NVD_API_KEY=${NVD_API_KEY:-}
      - CVE_HTTP_TIMEOUT_SECONDS=${CVE_HTTP_TIMEOUT_SECONDS:-45}
      - CVE_STALE_AFTER_HOURS=${CVE_STALE_AFTER_HOURS:-4}
      - NVD_REQUEST_DELAY_SECONDS=${NVD_REQUEST_DELAY_SECONDS:-6}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY to a secure random value of at least 32 characters}
      - AI_PROVIDER=${AI_PROVIDER:-noovastack-local}
      - AI_BASE_URL=${AI_BASE_URL:-https://chat.noovastack.com/api}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-qwen3.6-coder:35b-32k}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-240}
      - AI_MAX_OUTPUT_TOKENS=${AI_MAX_OUTPUT_TOKENS:-4096}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.2}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY to a secure random value of at least 32 characters}
    volumes:
      - ./backend:/app
      - scan_results:/app/results
    depends_on:
      - redis
      - postgres
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: host
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noovastack-celery-beat
    command: celery -A workers.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://noovastack:noovastack_secure_2024!@postgres:5432/noovastack_vapt
      - REDIS_URL=redis://:noovastack_redis_2024!@redis:6379/0
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://:noovastack_redis_2024!@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:noovastack_redis_2024!@redis:6379/2
      - NVD_API_KEY=${NVD_API_KEY:-}
      - CVE_HTTP_TIMEOUT_SECONDS=${CVE_HTTP_TIMEOUT_SECONDS:-45}
      - CVE_STALE_AFTER_HOURS=${CVE_STALE_AFTER_HOURS:-4}
      - NVD_REQUEST_DELAY_SECONDS=${NVD_REQUEST_DELAY_SECONDS:-6}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY to a secure random value of at least 32 characters}
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - celery-worker
    networks:
      - noovastack-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: noovastack-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - noovastack-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: noovastack-nginx
    volumes:
      - ./configs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"
    depends_on:
      - frontend
      - backend
    networks:
      - noovastack-network
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  scan_results:

networks:
  noovastack-network:
    driver: bridge
